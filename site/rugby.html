function U(){ return UI[LANG]; }

function seasonLabel(y){ return `${y}-${String(y+1).slice(2)}`; }
function pct(n,d){ return d ? (n/d*100) : 0; }
function fmt(x, digits){ return digits===0 ? Math.round(x).toLocaleString() : x.toFixed(digits); }
function v(id){ return document.getElementById(id).value; }

function rowsFor(playerIdx){
  const season = v('f-season');
  return RAW.P.filter(r => r[1]===playerIdx && (season==='all' || String(r[0])===season));
}
function emptyAcc(){ const c={}; PM.forEach(m=>c[m]=0); c.__m=0; return c; }
function accumFor(playerIdx){
  const acc = emptyAcc();
  rowsFor(playerIdx).forEach(r=>{ acc.__m += r[2]; PM.forEach(m=>acc[m]+=r[pIdx[m]]); });
  return acc;
}

function section(container, title){
  const h = document.createElement('div'); h.className='section-h'; h.textContent = title;
  container.appendChild(h);
  const card = document.createElement('div'); card.className='card';
  container.appendChild(card);
  return card;
}
function statRow(card, label, val, digits, note){
  const row = document.createElement('div'); row.className='row';
  const disp = val==null ? '–' : fmt(val, digits);
  row.innerHTML = `<div class="lbl">${label}</div><div class="val">${disp}${note?`<div class="note">${note}</div>`:''}</div>`;
  card.appendChild(row);
}
function totalAvgRow(card, label, c, key, digits){
  const tot = c[key], avg = c.__m ? tot/c.__m : 0;
  statRow(card, label, avg, 1, U().note_total(fmt(tot,digits)));
}
function pctRow(card, label, c, numKey, denKey){
  statRow(card, label, pct(c[numKey], c[denKey]), 1, U().note_pct(c[numKey], c[denKey]));
}
function kickMix(card, c){
  const keys = ['kick_retained','kick_pressure','kick_notsecured','kick_lost','kick_touch','kick_error'];
  const mix = document.createElement('div'); mix.className='kick-mix';
  keys.forEach(k=>{
    const p = pct(c[k], c.kicks);
    const el = document.createElement('div');
    el.textContent = `${U()[k]}: ${c[k]} (${p.toFixed(0)}%)`;
    mix.appendChild(el);
  });
  card.appendChild(mix);
}
function playtimeTable(playerIdx){
  const rows = rowsFor(playerIdx).slice().sort((a,b)=>a[0]-b[0]);
  const wrap = document.createElement('div');
  const table = document.createElement('table');
  table.innerHTML = `<thead><tr><th>${U().pt_col_season}</th><th>${U().pt_col_min}</th><th>${U().pt_col_gp}</th><th>${U().pt_col_avgmin}</th></tr></thead>`;
  const tbody = document.createElement('tbody');
  rows.forEach(r=>{
    const gp = r[2], mins = r[pIdx.playtime];
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${seasonLabel(r[0])}</td><td>${Math.round(mins)}</td><td>${gp}</td><td>${gp?(mins/gp).toFixed(1):'–'}</td>`;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody); wrap.appendChild(table);
  return wrap;
}

}

  if (hasOff) pctRow(card, U().off_scrum_pct, c, 'off_scrum_success', 'off_scrum_total');
  if (hasDef){
    statRow(card, U().def_scrum_pressure, c.def_scrum_total ? pct(c.def_scrum_pressure, c.def_scrum_total) : null, 1,
      `${c.def_scrum_pressure} / ${c.def_scrum_total}`);
    statRow(card, U().def_scrum_success, c.def_scrum_total ? pct(c.def_scrum_success, c.def_scrum_total) : null, 1,
      `${c.def_scrum_success} / ${c.def_scrum_total}`);
  }
}

function fillFilters(){
  const seasons = [...new Set(RAW.P.map(r=>r[0]))].sort((a,b)=>b-a);
  const sSel = document.getElementById('f-season');
  const prevSeason = sSel.value;
  sSel.replaceChildren(new Option(U().all_option, 'all'));
  seasons.forEach(y => sSel.appendChild(new Option(seasonLabel(y), String(y))));
  if ([...sSel.options].some(o => o.value === prevSeason)) sSel.value = prevSeason;

  const pSel = document.getElementById('f-player');
  const prevPlayer = pSel.value;
  const order = RAW.players.map((name,i)=>({name,i})).sort((a,b)=>a.name.localeCompare(b.name));
  pSel.replaceChildren();
  order.forEach(({name,i}) => pSel.appendChild(new Option(name, String(i))));
  if ([...pSel.options].some(o => o.value === prevPlayer)) pSel.value = prevPlayer;
}

function render(){
  const content = document.getElementById('content');
  const playerIdx = Number(v('f-player'));
  if (!RAW.players.length){
    content.innerHTML = `<div class="empty">${U().no_data}</div>`;
    return;
  }
  const pos = RAW.playerPos[playerIdx];
  const c = accumFor(playerIdx);

  content.replaceChildren();
  const head = document.createElement('div'); head.className = 'player-head';
  head.innerHTML = `<div class="name">${RAW.players[playerIdx]}</div><div class="pos">${pos || ''}</div>`;
  content.appendChild(head);

  const ptCard = section(content, U().sec_time);
  ptCard.appendChild(playtimeTable(playerIdx));

  const atk = section(content, U().sec_attack);
  totalAvgRow(atk, U().m_carries, c, 'carries', 0);
  totalAvgRow(atk, U().m_carrym, c, 'carry_distplus', 0);
  totalAvgRow(atk, U().m_post, c, 'carry_post', 0);
  totalAvgRow(atk, U().m_beaten, c, 'def_beaten', 0);
  totalAvgRow(atk, U().m_offload, c, 'offload', 0);
  pctRow(atk, U().m_offload_pct, c, 'offload_success', 'offload');
  totalAvgRow(atk, U().m_linebreak, c, 'linebreak', 0);
  totalAvgRow(atk, U().m_passes, c, 'passes', 0);

  const def = section(content, U().sec_defense);
  totalAvgRow(def, U().m_tackles, c, 'tackles', 0);
  pctRow(def, U().m_tackle_pct, c, 'tk_succ', 'tackles');
  totalAvgRow(def, U().m_jackal, c, 'jackal', 0);
  pctRow(def, U().m_jackal_pct, c, 'jackal_won', 'jackal');

  const ooa = section(content, U().sec_breakdown);
  totalAvgRow(ooa, U().m_atk_ooa, c, 'atk_ooa', 0);
  totalAvgRow(ooa, U().m_def_ooa, c, 'def_ooa', 0);

  const kick = section(content, U().sec_kick);
  totalAvgRow(kick, U().m_kicks, c, 'kicks', 0);
  totalAvgRow(kick, U().m_kickmtr, c, 'kick_mtr', 0);
  kickMix(kick, c);

  const other = section(content, U().sec_other);
  statRow(other, U().m_apm, c.playtime ? c.actions/c.playtime : 0, 2);

  fwBlock(content, pos, c);
  scrumBlock(content, c);
}

function setChrome(){
  document.documentElement.lang = LANG;
  document.title = U().title + ' — Toshiba Master Data';
  document.getElementById('nav-home').textContent = U().nav_home;
  document.getElementById('nav-rugby').textContent = U().nav_rugby;
  document.getElementById('nav-gym').textContent = U().nav_gym;
  document.getElementById('nav-conditioning').textContent = U().nav_conditioning;
  document.getElementById('logout-btn').textContent = U().logout_btn;
  document.getElementById('lang-ja').classList.toggle('active', LANG === 'ja');
  document.getElementById('lang-en').classList.toggle('active', LANG === 'en');
  document.getElementById('page-title').textContent = U().title;
  document.getElementById('page-sub').textContent = U().sub;
  document.getElementById('lbl-season').textContent = U().f_season;
  document.getElementById('lbl-player').textContent = U().f_player;
  document.getElementById('loading-msg').textContent = U().loading;
  document.getElementById('page-foot').textContent = U().foot;
}
setChrome();

async function doLogout(){
  await sb.auth.signOut();
  location.href = 'login.html';
}
document.getElementById('logout-btn').addEventListener('click', doLogout);
document.getElementById('f-season').addEventListener('change', render);
document.getElementById('f-player').addEventListener('change', render);
function setLang(lang){
  LANG = lang;
  localStorage.setItem('toshibaMasterDataLang', LANG);
  setChrome();
  if (RAW.players.length){ fillFilters(); render(); }
}
document.getElementById('lang-ja').addEventListener('click', () => setLang('ja'));
document.getElementById('lang-en').addEventListener('click', () => setLang('en'));

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session){
    location.href = 'login.html?next=rugby.html';
    return;
  }
  // This page's data (RAW above) is embedded static JSON, not a live
  // Supabase query -- the session check above just gates the page itself,
  // consistent with how the other Toshiba Master Data pages work.
  if (!RAW.players.length){
    document.getElementById('content').innerHTML = `<div class="empty">${U().no_data}</div>`;
    return;
  }
  fillFilters();
  render();
}
init();
</script>
