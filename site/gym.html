<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ジム — Toshiba Master Data</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { color-scheme: dark;
  --page:#08080a; --surface:#14141a; --ink-1:#f3f4f6; --ink-2:#c9cdd6; --ink-muted:#a0aec0;
  --border:rgba(197,160,89,.28); --gold:#c5a059; --red:#ff0b24; --radius:8px; --gap:14px; }
body { font-family: system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  background:var(--page); color:var(--ink-1); line-height:1.5; }
.topnav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  background:var(--surface);border-bottom:1px solid var(--border);padding:10px 18px;}
.topnav .brand{font-weight:800;font-size:15px;color:var(--gold);text-decoration:none;white-space:nowrap;letter-spacing:.02em;}
.topnav .navlinks{display:flex;gap:4px;flex-wrap:wrap;}
.topnav .navlinks a{font-size:13px;color:var(--ink-2);text-decoration:none;padding:6px 12px;border-radius:6px;white-space:nowrap;font-weight:600;}
.topnav .navlinks a:hover{background:rgba(255,255,255,.06);}
.topnav .navlinks a.active{background:var(--red);color:#fff;}
.topnav .spacer{flex:1;}
#logout-btn{font-size:12px;font-weight:700;color:var(--gold);background:var(--page);border:1px solid var(--border);
  border-radius:6px;padding:5px 11px;cursor:pointer;white-space:nowrap;}
#logout-btn:hover{background:rgba(255,255,255,.06);}
.lang-switch{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.lang-switch button{font-size:12px;font-weight:700;padding:5px 10px;cursor:pointer;border:none;background:var(--page);color:var(--gold);white-space:nowrap;}
.lang-switch button:hover{background:rgba(255,255,255,.06);}
.lang-switch button.active{background:var(--red);color:#fff;}
.wrap { max-width:900px; margin:0 auto; padding:18px var(--gap) 40px; }
header h1 { font-size:20px; font-weight:800; }
header .sub { font-size:12.5px; color:var(--ink-2); margin-top:2px; }
.empty { padding:60px 0; text-align:center; color:var(--ink-muted); font-size:13px; }
</style>
</head>
<body>
<nav class="topnav">
  <a class="brand" href="index.html">🏉 Toshiba Master Data</a>
  <div class="navlinks">
    <a href="index.html" id="nav-home"></a>
    <a href="rugby.html" id="nav-rugby"></a>
    <a href="gym.html" class="active" id="nav-gym"></a>
    <a href="conditioning.html" id="nav-conditioning"></a>
  </div>
  <span class="spacer"></span>
  <div class="lang-switch">
    <button id="lang-ja" type="button">日本語</button>
    <button id="lang-en" type="button">EN</button>
  </div>
  <button id="logout-btn" type="button"></button>
</nav>
<div class="wrap">
  <header>
    <h1 id="page-title"></h1>
    <div class="sub" id="page-sub"></div>
  </header>
  <div class="empty" id="page-empty"></div>
</div>
<script>
const SUPABASE_URL = 'https://rfezfalnfnoownxzibna.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_1Ri7VHRowpB0dotP1emnBw_jPcJCVN6';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const UI = {
  ja: { nav_home:'ホーム', nav_rugby:'ラグビー', nav_gym:'ジム', nav_conditioning:'コンディショニング',
    logout_btn:'ログアウト',
    title:'ジム', sub:'測定・トレーニングデータ',
    empty:'準備中です。データ形式が決まり次第、ここに測定結果(ベンチプレス・スクワット・スプリント等)を表示します。' },
  en: { nav_home:'Home', nav_rugby:'Rugby', nav_gym:'Gym', nav_conditioning:'Conditioning',
    logout_btn:'Sign out',
    title:'Gym', sub:'Measurement & training data',
    empty:'Coming soon. Once the data format is decided, measurement results (bench press, squat, sprint times, etc.) will show up here.' },
};
let LANG = localStorage.getItem('toshibaMasterDataLang') ||
  ((navigator.language || '').toLowerCase().startsWith('ja') ? 'ja' : 'en');
function U(){ return UI[LANG]; }
function setChrome(){
  document.documentElement.lang = LANG;
  document.getElementById('nav-home').textContent = U().nav_home;
  document.getElementById('nav-rugby').textContent = U().nav_rugby;
  document.getElementById('nav-gym').textContent = U().nav_gym;
  document.getElementById('nav-conditioning').textContent = U().nav_conditioning;
  document.getElementById('logout-btn').textContent = U().logout_btn;
  document.getElementById('lang-ja').classList.toggle('active', LANG === 'ja');
  document.getElementById('lang-en').classList.toggle('active', LANG === 'en');
  document.getElementById('page-title').textContent = U().title;
  document.getElementById('page-sub').textContent = U().sub;
  document.getElementById('page-empty').textContent = U().empty;
}
setChrome();
function setLang(lang){
  LANG = lang;
  localStorage.setItem('toshibaMasterDataLang', LANG);
  setChrome();
}
document.getElementById('lang-ja').addEventListener('click', () => setLang('ja'));
document.getElementById('lang-en').addEventListener('click', () => setLang('en'));

async function doLogout(){
  await sb.auth.signOut();
  location.href = 'login.html';
}
document.getElementById('logout-btn').addEventListener('click', doLogout);

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) location.href = 'login.html?next=gym.html';
})();
</script>
</body>
</html>
